<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="上越直江津の出船判断と東京湾の陸っぱり釣り場の気象・波浪・潮汐をまとめて確認するダッシュボード">
<meta name="color-scheme" content="light dark">
<title>釣行ダッシュボード｜上越直江津・東京湾</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🎣</text></svg>">
</head>
<body>

<header>
  <h1>🎣 釣行ダッシュボード</h1>
  <div class="spacer"></div>
  <div id="stamp" class="stamp"></div>
  <button id="refresh" type="button">再取得</button>
  <button id="theme" type="button" title="ライト／ダークを切り替え" aria-label="テーマ切り替え">◐</button>
</header>

<nav class="tabs" role="tablist">
  <button type="button" role="tab" data-tab="boat" aria-selected="true">出船</button>
  <button type="button" role="tab" data-tab="shore" aria-selected="false">陸っぱり</button>
  <button type="button" role="tab" data-tab="settings" aria-selected="false">設定・限界</button>
  <button type="button" role="tab" data-tab="manual" aria-selected="false">使い方</button>
</nav>

<main>
  <div id="errors"></div>
  <div id="loading" class="spinner">気象・波浪データを取得しています…</div>

  <section id="tab-boat" role="tabpanel">
    <!-- 出船地点の横断比較。釣り場が増えるほど「どこなら出せるか」が主問題になるので先頭に置く -->
    <div id="matrix"></div>
    <!-- 釣り場の選択。以下のパネルはすべて選択中の1か所について描く -->
    <div id="boat-picker"></div>
    <div id="coverage" class="muted" style="margin-bottom:10px"></div>
    <div id="windows"></div>
    <div id="strip"></div>
    <div id="ensemble"></div>
    <div id="detail"></div>
    <div id="official"></div>
  </section>

  <!-- 中身の id はタブのハッシュ（#shore / #settings）と衝突させない。
       同名だとブラウザがその要素までスクロールし、見出しが固定ヘッダの下に隠れる。 -->
  <section id="tab-shore" role="tabpanel" hidden>
    <div id="shore-body"></div>
  </section>

  <section id="tab-settings" role="tabpanel" hidden>
    <div id="settings-body"></div>
  </section>

  <section id="tab-manual" role="tabpanel" hidden>
    <div id="manual-body"></div>
  </section>
</main>

<footer>
  <p>
    気象・波浪: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
    （ECMWF IFS / NCEP GFS / DWD ICON / 気象庁 の4モデル、波浪は best match）／
    潮汐: <a href="https://www.data.jma.go.jp/kaiyou/db/tide/suisan/" target="_blank" rel="noopener">気象庁 潮位表</a>
    （直江津・東京・横浜）
  </p>
  <p>
    風速は m/s。判定は朝マヅメ帯の最悪値。<b>波浪予報は8日先までしか存在せず</b>、9日目以降は風のみの暫定判定です。
    最終的な出船可否は現地の海況と気象庁・海上保安庁の警報で判断してください。
  </p>
</footer>

<!-- tide-data:start / rewritten by tools/Build-Tide.ps1 -->
<script src="data/tide-2026.js"></script>
<script src="data/tide-2027.js"></script>
<!-- tide-data:end -->
<!-- Yahoo!天気の週間予報（tools/Fetch-Yahoo.ps1 が生成）。無くてもアプリは動く -->
<script src="data/yahoo.js"></script>
<!-- 予報の答え合わせ（tools/Record-Forecast.ps1 が生成）。無くてもアプリは動く -->
<script src="data/verify.js"></script>
<script src="assets/spots.js"></script>
<script src="assets/tide.js"></script>
<script src="assets/rating.js"></script>
<script src="assets/ensemble.js"></script>
<script src="assets/jma.js"></script>
<script src="assets/yahoo.js"></script>
<script src="assets/verify.js"></script>
<script src="assets/manual.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
