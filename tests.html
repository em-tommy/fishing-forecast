<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>fishing-forecast tests</title>
<style>
  body { font-family: ui-monospace, Consolas, monospace; padding: 1rem; line-height: 1.5; }
  .pass { color: #157f3b; }
  .fail { color: #c0392b; font-weight: bold; }
  h2 { margin: 1.2rem 0 .3rem; font-size: 1rem; border-bottom: 1px solid #ccc; }
  #summary { font-size: 1.1rem; font-weight: bold; margin-bottom: 1rem; }
</style>
</head>
<body>
<div id="summary">running...</div>
<div id="out"></div>

<!-- tide-data:start / rewritten by tools/Build-Tide.ps1 -->
<script src="data/tide-2026.js"></script>
<script src="data/tide-2027.js"></script>
<!-- tide-data:end -->
<!-- Yahoo!天気の週間予報（tools/Fetch-Yahoo.ps1 が生成）。無くてもアプリは動く -->
<script src="data/yahoo.js"></script>
<script src="assets/spots.js"></script>
<script src="assets/tide.js"></script>
<script src="assets/rating.js"></script>
<script src="assets/ensemble.js"></script>
<script src="data/verify.js"></script>
<script src="assets/verify.js"></script>
<script src="assets/jma.js"></script>
<script src="assets/yahoo.js"></script>
<script>
(function () {
  var out = document.getElementById('out');
  var passed = 0, failed = 0;

  function section(name) {
    var h = document.createElement('h2');
    h.textContent = name;
    out.appendChild(h);
  }
  function log(ok, msg, detail) {
    var d = document.createElement('div');
    d.className = ok ? 'pass' : 'fail';
    d.textContent = (ok ? 'PASS  ' : 'FAIL  ') + msg + (detail ? '   [' + detail + ']' : '');
    out.appendChild(d);
    if (ok) passed++; else failed++;
  }
  function eq(actual, expected, msg) {
    var ok = actual === expected;
    log(ok, msg, ok ? '' : 'expected=' + expected + ' actual=' + actual);
  }
  function near(actual, expected, tol, msg) {
    var ok = typeof actual === 'number' && Math.abs(actual - expected) <= tol;
    log(ok, msg, ok ? '' : 'expected~' + expected + '+-' + tol + ' actual=' + actual);
  }
  function ok(cond, msg, detail) { log(!!cond, msg, cond ? '' : (detail || '')); }

  var R = FF.rating;
  var T = FF.tide;
  var J = FF.jma;

  // ---------------------------------------------------------------- helpers

  var MODELS = ['ecmwf_ifs025', 'gfs_seamless', 'icon_seamless', 'jma_seamless'];

  function spread(value, models) {
    var o = {};
    (models || MODELS).forEach(function (m) { o[m] = value; });
    return o;
  }

  /** 全時刻が同一条件の合成日をつくる。個別の時刻は override で差し替える。 */
  function makeDay(cfg) {
    var hours = [];
    for (var h = 0; h < 24; h++) {
      hours.push({
        hour: h,
        wind: spread(cfg.wind),
        gust: spread(cfg.gust),
        dir: spread(cfg.dir === undefined ? 180 : cfg.dir),
        wave: cfg.wave === undefined ? 0.1 : cfg.wave,
        swellHeight: cfg.swellHeight === undefined ? 0.05 : cfg.swellHeight,
        swellPeriod: cfg.swellPeriod === undefined ? 4 : cfg.swellPeriod,
        precipProb: 0,
        weatherCode: cfg.weatherCode === undefined ? 1 : cfg.weatherCode
      });
    }
    if (cfg.override) cfg.override(hours);
    return {
      date: cfg.date || '2026-08-01',
      sunrise: cfg.sunrise === undefined ? 5 : cfg.sunrise,
      sunset: cfg.sunset === undefined ? 19 : cfg.sunset,
      hours: hours
    };
  }

  // ---------------------------------------------------------------- levelFor

  section('levelFor の境界値（風 good=4 fair=6 / 波 good=0.30 fair=0.50）');
  eq(R.levelFor(4.0, 4, 6), 3, '風 4.0 は ◎');
  eq(R.levelFor(4.1, 4, 6), 2, '風 4.1 は ○');
  eq(R.levelFor(5.0, 4, 6), 2, '風 5.0 は ○（◎と△の中点）');
  eq(R.levelFor(5.01, 4, 6), 1, '風 5.01 は △');
  eq(R.levelFor(6.0, 4, 6), 1, '風 6.0 は △');
  eq(R.levelFor(6.01, 4, 6), 0, '風 6.01 は ×');
  eq(R.levelFor(0.30, 0.30, 0.50), 3, '波 0.30 は ◎');
  eq(R.levelFor(0.31, 0.30, 0.50), 2, '波 0.31 は ○');
  eq(R.levelFor(0.41, 0.30, 0.50), 1, '波 0.41 は △');
  eq(R.levelFor(0.51, 0.30, 0.50), 0, '波 0.51 は ×');
  eq(R.levelFor(null, 4, 6), null, '値なしは null（その指標では判定しない）');

  // ---------------------------------------------------------------- 統計

  section('欠損混じりの統計');
  eq(R.median([3, 1, 2]), 2, '中央値（奇数個）');
  eq(R.median([1, 2, 3, 4]), 2.5, '中央値（偶数個）');
  eq(R.median([3, null, 1, undefined, 2]), 2, 'null/undefined を除外して中央値');
  eq(R.median([null, null]), null, '全欠損なら null');
  eq(R.median([5, NaN]), 5, 'NaN を除外');
  eq(R.stdev([2]), null, '有効値1個では標準偏差を出さない');
  near(R.stdev([2, 4]), 1, 1e-9, '標準偏差（母集団）');
  eq(R.maxOf([1, null, 9, 3]), 9, '最大値は null を無視');
  eq(R.maxOf([null]), null, '全欠損の最大値は null');

  section('風向は循環量として扱う');
  near(R.circularMeanDeg([350, 10]), 0, 0.001, '350°と10°の平均は0°（180°ではない）');
  near(R.circularMeanDeg([80, 100]), 90, 0.001, '80°と100°の平均は90°');
  eq(R.circularMeanDeg([null, null]), null, '全欠損は null');
  ok(R.inDirRange(350, 292.5, 67.5), '0°をまたぐレンジ: 350° は内側');
  ok(R.inDirRange(10, 292.5, 67.5), '0°をまたぐレンジ: 10° は内側');
  ok(!R.inDirRange(180, 292.5, 67.5), '0°をまたぐレンジ: 180° は外側');
  ok(R.inDirRange(180, 112.5, 247.5), '通常レンジ: 180° は内側');
  eq(R.dirName(0), '北', '0° は北');
  eq(R.dirName(315), '北西', '315° は北西');
  eq(R.dirName(180), '南', '180° は南');

  // ---------------------------------------------------------------- 日別評価

  section('evaluateDay: 基本判定');
  var calm = R.evaluateDay(makeDay({ wind: 2.0, gust: 4.0, wave: 0.15 }));
  eq(calm.grade, 3, '無風・凪 → ◎');
  eq(calm.gradeInfo.symbol, '◎', '記号も ◎');

  var blowing = R.evaluateDay(makeDay({ wind: 8.0, gust: 12.0, wave: 0.9 }));
  eq(blowing.grade, 0, '強風・高波 → ×');

  var worstWins = R.evaluateDay(makeDay({ wind: 2.0, gust: 4.0, wave: 0.9 }));
  eq(worstWins.grade, 0, '風が穏やかでも波が高ければ × （最悪値で決まる）');

  section('evaluateDay: 判定窓は朝マヅメ帯だけ');
  var pmOnly = R.evaluateDay(makeDay({
    wind: 2.0, gust: 4.0, wave: 0.1,
    sunrise: 5,
    override: function (hours) {
      for (var h = 12; h < 20; h++) { hours[h].wind = spread(15); hours[h].wave = 2.0; }
    }
  }));
  ok(pmOnly.grade === 3, '午後だけ荒れても朝マヅメ帯の判定は ◎ のまま', 'grade=' + pmOnly.grade);
  ok(pmOnly.flags.indexOf('afternoonBuildup') >= 0, '午後の吹き上がりは警告として出る');
  eq(pmOnly.metrics.maxAfternoonWind, 15, '午後の最大風速を記録');

  var windowCheck = R.evaluateDay(makeDay({ wind: 2, gust: 3, sunrise: 5 }));
  eq(windowCheck.window.from, 4, '判定窓の開始は日の出-1時間');
  eq(windowCheck.window.to, 9, '判定窓の終了は日の出+4時間');

  section('時間帯（朝マヅメ / 昼間 / 夕マヅメ / 終日）');
  var D = R.DEFAULTS;
  function span(period, sr, ss) {
    return R.windowFor(period, sr, ss, D).join('〜');
  }
  eq(span('morning', 5, 19), '4〜9', '朝マヅメ = 日の出-1 〜 日の出+4');
  eq(span('evening', 5, 19), '15〜20', '夕マヅメ = 日の入-4 〜 日の入+1');
  eq(span('day', 5, 19), '9〜15', '昼間 = 朝マヅメの終わり 〜 夕マヅメの始まり（隙間も重複も無い）');
  eq(span('allday', 5, 19), '4〜20', '終日 = 朝マヅメの開始 〜 夕マヅメの終了');

  // 冬は日照が短いので昼が自動的に縮む。固定時刻で切っていたらここがずれる。
  eq(span('morning', 7, 16.5), '6〜11', '冬の朝マヅメ');
  eq(span('evening', 7, 16.5), '12.5〜17.5', '冬の夕マヅメ');
  eq(span('day', 7, 16.5), '11〜12.5', '冬の昼間は1時間半に縮む');

  // 日照がさらに短く朝と夕が重なる場合は南中前後にフォールバックする
  // 日の出8:00・日の入15:00 → 朝は12時まで、夕は11時から。重なるので南中(11:30)±1時間
  eq(span('day', 8, 15), '10.5〜12.5', '朝と夕が重なる日は南中±1時間を昼とみなす');

  ok(R.windowFor('morning', 0.5, 19, D)[0] === 0, '日の出が早すぎても0時より前にはしない');
  ok(R.windowFor('evening', 5, 23, D)[1] === 23, '日の入が遅くても23時を超えない');
  eq(span('unknown', 5, 19), '4〜9', '未知の時間帯は朝マヅメにフォールバック');

  var evening = R.evaluateDay(makeDay({
    wind: 2, gust: 3, wave: 0.1, sunrise: 5, sunset: 19,
    override: function (hours) {
      for (var h = 15; h <= 20; h++) { hours[h].wind = spread(9); hours[h].wave = 0.9; }
    }
  }), null, { period: 'evening' });
  eq(evening.grade, 0, '夕マヅメを選ぶと夕方の荒れが判定に効く');
  eq(evening.window.label, '夕マヅメ', '窓のラベルが付く');

  var morningSame = R.evaluateDay(makeDay({
    wind: 2, gust: 3, wave: 0.1, sunrise: 5, sunset: 19,
    override: function (hours) {
      for (var h = 15; h <= 20; h++) { hours[h].wind = spread(9); hours[h].wave = 0.9; }
    }
  }), null, { period: 'morning' });
  eq(morningSame.grade, 3, '同じ日でも朝マヅメなら ◎（時間帯で判定が変わる）');

  var noonPick = R.evaluateDay(makeDay({
    wind: 2, gust: 3, wave: 0.1, sunrise: 5, sunset: 19,
    override: function (hours) {
      for (var h = 9; h < 15; h++) { hours[h].wind = spread(8); }
    }
  }), null, { period: 'day' });
  eq(noonPick.grade, 0, '昼間を選ぶと日中の強風が効く');

  var pmFlagEvening = R.evaluateDay(makeDay({
    wind: 2, gust: 3, wave: 0.1, sunrise: 5, sunset: 19,
    override: function (hours) {
      for (var h = 12; h <= 16; h++) hours[h].wind = spread(15);
    }
  }), null, { period: 'evening' });
  ok(pmFlagEvening.flags.indexOf('afternoonBuildup') < 0,
    '午後の吹き上がり警告は朝マヅメのときだけ（夕方判定では意味を成さない）');

  section('evaluateDay: うねり補正');
  var swell = R.evaluateDay(makeDay({
    wind: 2.0, gust: 4.0, wave: 0.25, swellHeight: 0.25, swellPeriod: 9
  }));
  eq(swell.grade, 2, '長周期うねり（9s / 0.25m）で ◎ から1段階格下げ');
  ok(swell.flags.indexOf('longSwell') >= 0, 'longSwell フラグが立つ');

  var shortSwell = R.evaluateDay(makeDay({
    wind: 2.0, gust: 4.0, wave: 0.25, swellHeight: 0.25, swellPeriod: 6
  }));
  eq(shortSwell.grade, 3, '周期が短ければ格下げしない');

  var tinySwell = R.evaluateDay(makeDay({
    wind: 2.0, gust: 4.0, wave: 0.25, swellHeight: 0.1, swellPeriod: 12
  }));
  eq(tinySwell.grade, 3, '周期が長くても高さが無ければ格下げしない');

  section('evaluateDay: 風向');
  var onshore = R.evaluateDay(makeDay({ wind: 3.5, gust: 5.0, wave: 0.2, dir: 315 }));
  eq(onshore.grade, 2, '北西の吹き付け風で1段階格下げ');
  ok(onshore.flags.indexOf('onshore') >= 0, 'onshore フラグ');

  var weakOnshore = R.evaluateDay(makeDay({ wind: 1.5, gust: 3.0, wave: 0.1, dir: 315 }));
  eq(weakOnshore.grade, 3, '風が弱ければ（3m/s未満）向きは問わない');

  var offshore = R.evaluateDay(makeDay({ wind: 3.5, gust: 5.0, wave: 0.2, dir: 180 }));
  eq(offshore.grade, 3, '南の陸風は判定を下げない');
  ok(offshore.flags.indexOf('offshore') >= 0, 'offshore は警告フラグのみ');

  var noDirCheck = R.evaluateDay(
    makeDay({ wind: 3.5, gust: 5.0, wave: 0.2, dir: 315 }), null, { checkDirection: false }
  );
  eq(noDirCheck.grade, 3, '陸っぱりモードでは風向ペナルティを適用しない');

  section('evaluateDay: 荒天');
  var thunder = R.evaluateDay(makeDay({ wind: 1.0, gust: 2.0, wave: 0.05, weatherCode: 95 }));
  eq(thunder.grade, 0, '雷予報は風も波も穏やかでも × にする');
  ok(thunder.flags.indexOf('thunder') >= 0, 'thunder フラグ');

  var heavyRain = R.evaluateDay(makeDay({ wind: 1.0, gust: 2.0, wave: 0.05, weatherCode: 65 }));
  eq(heavyRain.grade, 2, '強い雨は1段階格下げ（◎→○）');
  ok(heavyRain.flags.indexOf('heavyRain') >= 0, 'heavyRain フラグ');

  var lightRain = R.evaluateDay(makeDay({ wind: 1.0, gust: 2.0, wave: 0.05, weatherCode: 61 }));
  eq(lightRain.grade, 3, '弱い雨では格下げしない');

  var afternoonThunder = R.evaluateDay(makeDay({
    wind: 1.0, gust: 2.0, wave: 0.05, sunrise: 5,
    override: function (hours) { for (var h = 13; h < 18; h++) hours[h].weatherCode = 95; }
  }));
  eq(afternoonThunder.grade, 3, '午後だけの雷は朝マヅメ判定を下げない');

  section('evaluateDay: 9日目以降（波高データなし）');
  var windOnly = R.evaluateDay(makeDay({ wind: 3.0, gust: 5.0, wave: null, swellHeight: null, swellPeriod: null }));
  eq(windOnly.grade, 2, '波高が無い日は ◎ を名乗れず ○ 止まり');
  ok(windOnly.flags.indexOf('windOnly') >= 0, 'windOnly フラグで暫定判定と分かる');
  eq(windOnly.metrics.maxWave, null, '波高は null のまま（無いものを作らない）');

  var windOnlyBad = R.evaluateDay(makeDay({ wind: 9.0, gust: 14.0, wave: null }));
  eq(windOnlyBad.grade, 0, '波高が無くても強風なら × にはできる（上限だけを抑える）');

  var noData = R.evaluateDay(makeDay({ wind: null, gust: null, wave: null }));
  eq(noData.grade, null, '全欠損なら grade は null');
  eq(noData.gradeInfo.label, 'データなし', 'データなし表示');

  section('evaluateDay: モデル一致度');
  var agree = R.evaluateDay(makeDay({ wind: 3, gust: 5, wave: 0.2 }));
  eq(agree.confidence.level, 'high', '全モデル一致 → 信頼度 高');

  var disagree = R.evaluateDay(makeDay({
    wind: 3, gust: 5, wave: 0.2,
    override: function (hours) {
      hours.forEach(function (r) {
        r.wind = { ecmwf_ifs025: 1, gfs_seamless: 3, icon_seamless: 6, jma_seamless: 9 };
      });
    }
  }));
  eq(disagree.confidence.level, 'low', 'モデルがばらつく → 信頼度 低');

  var jmaGustNull = R.evaluateDay(makeDay({
    wind: 3, gust: 5, wave: 0.2,
    override: function (hours) {
      hours.forEach(function (r) { r.gust.jma_seamless = null; });
    }
  }));
  eq(jmaGustNull.metrics.maxGust, 5, 'JMA の突風が null でも他モデルから中央値を出す');

  // ---------------------------------------------------------------- 連続凪

  section('findCalmWindows');
  function fake(date, grade, flags) {
    return { date: date, grade: grade, flags: flags || [] };
  }
  var wins = R.findCalmWindows([
    fake('2026-08-01', 3), fake('2026-08-02', 3), fake('2026-08-03', 0),
    fake('2026-08-04', 2), fake('2026-08-05', 1), fake('2026-08-06', 2),
    fake('2026-08-07', 2), fake('2026-08-08', 2)
  ]);
  eq(wins.length, 2, '2日以上連続する区間が2つ');
  eq(wins[0].start, '2026-08-01', '最良の窓が先頭（minGrade が高い順）');
  eq(wins[0].length, 2, '8/1-8/2 は2日連続');
  eq(wins[1].start, '2026-08-06', '次点は 8/6 からの3日');
  eq(wins[1].length, 3, '8/6-8/8 は3日連続');

  var single = R.findCalmWindows([fake('2026-08-01', 3), fake('2026-08-02', 0)]);
  eq(single.length, 0, '単日は連続窓として扱わない');

  var windOnlyWin = R.findCalmWindows([
    fake('2026-08-10', 3, ['windOnly']), fake('2026-08-11', 3, ['windOnly'])
  ]);
  eq(windOnlyWin[0].windOnly, true, '全日が波高なしなら窓にも windOnly が立つ');

  // 制約が1つ欠けているだけの窓が、実測で凪と分かっている窓より上に来てはいけない
  var mixed = R.findCalmWindows([
    fake('2026-08-01', 2), fake('2026-08-02', 2), fake('2026-08-03', 0),
    fake('2026-08-09', 3, ['windOnly']), fake('2026-08-10', 3, ['windOnly'])
  ]);
  eq(mixed[0].start, '2026-08-01', '波高データのある窓を、grade が高い風のみ窓より先に並べる');
  eq(mixed[1].start, '2026-08-09', '風のみの窓は後ろ');

  // ---------------------------------------------------------------- 気象庁との突き合わせ

  section('気象庁の予報文の解釈');
  eq(J.parseWaveMeters('０．５メートル　後　１．５メートル'), 1.5, '全角の波高予報文から最大値を取る');
  eq(J.parseWaveMeters('１メートル'), 1, '単一の値');
  eq(J.parseWaveMeters('０．５メートル'), 0.5, '小数点は全角の中点ではなく「．」');
  eq(J.parseWaveMeters('２メートル　後　３メートル　うねり　を伴う'), 3, '「うねりを伴う」が付いても拾える');
  eq(J.parseWaveMeters(''), null, '空文字は null');
  eq(J.parseWaveMeters('波はおだやか'), null, '数値が無ければ null');
  eq(J.telop(300), '雨', '天気コード 300 は雨');
  eq(J.telop(203), '曇時々雨', '天気コード 203 は曇時々雨');
  eq(J.telop(101), '晴時々曇', '天気コード 101 は晴時々曇');
  eq(J.telop(999), '—', '未知のコードは —');
  eq(J.telop(398), '雨', '未収録でも百の位でカテゴリに落とす');
  eq(J.tidy('北の風　後　西の風'), '北の風 後 西の風', '全角スペースを半角に詰める');
  eq(J.tidy('０．５メートル　後　１．５メートル'), '0.5m 後 1.5m',
    '全角数字を半角に、単位「メートル」を m にそろえる（狭い画面で読みにくいため）');
  // tidy() を通したあとの文字列も解析できないと、表示を短くした瞬間に判定が壊れる
  eq(J.parseWaveMeters(J.tidy('０．５メートル　後　１．５メートル')), 1.5,
    'tidy 後の「0.5m 後 1.5m」からも最大波高を取れる');
  eq(J.parseWaveMeters('1m'), 1, '半角の m 表記');
  eq(J.parseWaveMeters('0.5m 後 2m うねり を伴う'), 2, 'm 表記でも最大値');
  eq(J.parseWaveMeters('降水量 30mm'), null, 'mm は波高として拾わない');

  section('気象庁とモデル値の食い違い検出');
  function withOfficial(official, extra) {
    return Object.assign({
      official: official,
      dayMaxWave: 0.7,
      daily: { precipMax: 50 },
      confidence: { level: 'high' }
    }, extra || {});
  }
  eq(R.findConflicts({ official: null }).length, 0, '気象庁データが無ければ食い違いも無い');
  var cWave = R.findConflicts(withOfficial({ waveMeters: 1.5, pop: 50 }));
  eq(cWave.length, 1, '気象庁の波が 0.3m 以上高ければ知らせる');
  eq(cWave[0].kind, 'wave', '種別は wave');
  eq(R.findConflicts(withOfficial({ waveMeters: 1.0, pop: 50 })).length, 1, '0.7 対 1.0（差0.3）は境界で検出');
  eq(R.findConflicts(withOfficial({ waveMeters: 0.99, pop: 50 })).length, 0, '差 0.29 では出さない');
  eq(R.findConflicts(withOfficial({ waveMeters: 0.2, pop: 50 })).length, 0,
    '気象庁のほうが低い場合は知らせない（安全側に倒れるので）');
  var cPop = R.findConflicts(withOfficial({ waveMeters: null, pop: 10 }));
  eq(cPop.length, 1, '降水確率が30ポイント以上違えば知らせる');
  eq(cPop[0].kind, 'pop', '種別は pop');
  eq(R.findConflicts(withOfficial({ waveMeters: null, pop: 25 })).length, 0, '差25ポイントでは出さない');
  section('Yahoo天気の突き合わせ');
  eq(FF.yahoo.icon('曇一時雨'), '🌧', '雨を含めば雨アイコン');
  eq(FF.yahoo.icon('晴時々曇'), '⛅', '晴と曇が混ざれば薄曇り');
  eq(FF.yahoo.icon('晴'), '☀', '晴');
  eq(FF.yahoo.icon('曇時々雪'), '🌨', '雪が優先');
  eq(FF.yahoo.icon('雷を伴う雨'), '⛈', '雷が最優先');
  eq(FF.yahoo.icon(null), '·', '値なし');
  ok(FF.yahoo.available(), 'data/yahoo.js が読み込まれている');
  ok(FF.yahoo.point('15222') && FF.yahoo.point('15222').name === '上越市', '上越市の地点が引ける');
  ok(FF.yahoo.coverage('15222').count >= 3, '上越市に3日以上のデータがある');
  ok(FF.yahoo.point('99999') === null, '未知の地点コードは null');

  // Yahoo 10% / 当アプリ 50% / 気象庁 50% なので、当アプリとの差と気象庁との割れの両方が出る
  var cy = R.findConflicts(withOfficial({ waveMeters: null, pop: 50 }, { yahoo: { pop: 10 } }));
  ok(cy.some(function (c) { return c.kind === 'yahooPop'; }),
    'Yahooと当アプリの降水確率が30ポイント以上違えば知らせる');
  // Yahoo 10 / 気象庁 35 / 当アプリ 45 → Yahoo対当アプリだけが30ポイント以上離れる
  var cyOnly = R.findConflicts(withOfficial(
    { waveMeters: null, pop: 35 }, { yahoo: { pop: 10 }, daily: { precipMax: 45 } }));
  eq(cyOnly.length, 1, '気象庁とYahooが近ければ、当アプリとの差だけを出す');
  eq(cyOnly[0].kind, 'yahooPop', '種別は yahooPop');
  var cSplit = R.findConflicts(withOfficial({ waveMeters: null, pop: 80 }, { yahoo: { pop: 50 } }));
  ok(cSplit.some(function (c) { return c.kind === 'sourceSplit'; }),
    '気象庁とYahooが割れていることも知らせる');
  eq(R.findConflicts(withOfficial({ waveMeters: null, pop: 50 }, { yahoo: { pop: 45 } })).length, 0,
    '5ポイント差では何も出さない');
  eq(R.findConflicts(withOfficial({ waveMeters: null, pop: 50 }, { yahoo: null })).length, 0,
    'Yahooのデータが無い日は何も出さない');

  var cRel = R.findConflicts(withOfficial({ waveMeters: null, pop: 50, reliability: 'C' }));
  eq(cRel.length, 1, 'モデルは一致でも気象庁の確度が C なら知らせる');
  eq(R.findConflicts(withOfficial({ waveMeters: null, pop: 50, reliability: 'A' })).length, 0,
    '確度 A なら何も出さない');
  eq(R.findConflicts(withOfficial({ waveMeters: null, pop: 50, reliability: 'C' },
    { confidence: { level: 'low' } })).length, 0, 'こちらも自信が無いなら食い違いではない');
  eq(R.findConflicts(withOfficial({ waveMeters: 1.5, pop: 10, reliability: 'C' })).length, 3,
    '3種類とも同時に出る');

  // ---------------------------------------------------------------- 潮汐

  section('潮汐データ（気象庁 実データとの突合）');
  var qs = T.daySummary('QS', '2026-01-01');
  ok(!!qs, '横浜 2026-01-01 のデータが存在する');
  eq(qs.highs.length, 2, '満潮2回');
  eq(qs.highs[0].time, '04:08', '第1満潮 04:08');
  eq(qs.highs[0].level, 163, '第1満潮 163cm');
  eq(qs.highs[1].time, '14:08', '第2満潮 14:08');
  eq(qs.highs[1].level, 169, '第2満潮 169cm');
  eq(qs.lows[0].time, '08:58', '第1干潮 08:58');
  eq(qs.lows[0].level, 123, '第1干潮 123cm');
  eq(qs.lows[1].time, '21:32', '第2干潮 21:32');
  eq(qs.lows[1].level, 1, '第2干潮 1cm');
  eq(qs.hourly.length, 24, '毎時値は24個');
  eq(qs.max, 169, '毎時値の最大が第2満潮と一致');

  var tk = T.daySummary('TK', '2026-07-28');
  ok(!!tk, '東京 2026-07-28 のデータが存在する');
  eq(tk.name, '東京', '表示名は app 側の定義から引く');

  var t3 = T.daySummary('T3', '2026-07-28');
  eq(t3.name, '直江津', '直江津の表示名');
  ok(t3.range < 60, '直江津の潮差は日本海側らしく小さい（<60cm）', 'range=' + t3.range);
  var qs728 = T.daySummary('QS', '2026-07-28');
  ok(qs728.range > 100, '同じ日の横浜は潮差が大きい（>100cm）', 'range=' + qs728.range);
  ok(t3.range < qs728.range / 2, '直江津の潮差は横浜の半分未満');

  ok(T.daySummary('QS', '2030-01-01') === null, '範囲外の日付は null を返す');
  ok(T.daySummary('XX', '2026-01-01') === null, '未知の地点は null を返す');

  // 潮汐は年ごとのファイルを重ねて読む。年をまたぐ釣行のために2027年分も読んでいるので、
  // 「365日」ではなく「読み込んだ年数ぶん連続していること」を確かめる。
  var cov = T.coverage('QS');
  var years = (window.TIDE_DATA && window.TIDE_DATA.years) ? window.TIDE_DATA.years.slice().sort() : [2026];
  eq(cov.first, years[0] + '-01-01', '開始日は最初の年の元日');
  eq(cov.last, years[years.length - 1] + '-12-31', '終了日は最後の年の大晦日');
  ok(cov.count >= 365 * years.length, '読み込んだ年数ぶんの日数がある');

  eq(T.STATION_NAMES.QN, '横須賀', '横須賀の潮汐地点が読める');
  ok(T.coverage('QN') && T.coverage('QN').count >= 365, '横須賀も年ぶんの潮位がある');
  var qn = T.daySummary('QN', '2026-08-15');
  ok(qn && qn.hourly.length === 24, '横須賀の毎時潮位が24点ある');

  section('潮位の補間');
  eq(Math.round(T.levelAt('QS', '2026-01-01', 0)), qs.hourly[0], '整数時ちょうどは毎時値と一致');
  eq(Math.round(T.levelAt('QS', '2026-01-01', 5)), qs.hourly[5], '5時も毎時値と一致');
  var mid = T.levelAt('QS', '2026-01-01', 0.5);
  ok(mid > Math.min(qs.hourly[0], qs.hourly[1]) && mid < Math.max(qs.hourly[0], qs.hourly[1]),
    '0.5時は0時と1時の間に入る', 'mid=' + mid);
  var lastHour = T.levelAt('QS', '2026-12-31', 23.5);
  ok(lastHour !== null, '年末最終日でも補間が落ちない（翌日が無い場合の処理）');

  section('潮回りと潮差の整合（月齢計算の実データ検証）');
  var byPhase = {};
  var keys = Object.keys(TIDE_DATA.stations.QS.days);
  keys.forEach(function (k) {
    var s = T.daySummary('QS', k);
    (byPhase[s.phase] = byPhase[s.phase] || []).push(s.range);
  });
  function mean(a) { return a.reduce(function (x, y) { return x + y; }, 0) / a.length; }
  var big = mean(byPhase['大潮']), mid2 = mean(byPhase['中潮']), small = mean(byPhase['小潮']);
  ok(big > mid2, '大潮の平均潮差 > 中潮', Math.round(big) + ' vs ' + Math.round(mid2));
  ok(mid2 > small, '中潮の平均潮差 > 小潮', Math.round(mid2) + ' vs ' + Math.round(small));
  ok(big > small * 1.5, '大潮は小潮の1.5倍以上の潮差',
    Math.round(big) + ' vs ' + Math.round(small));
  ok(byPhase['長潮'] && byPhase['若潮'], '長潮・若潮も出現する');

  section('潮汐の向きと転流');
  var trend = T.tideTrend('QS', '2026-01-01', 4.13, 8.97); // 満潮 -> 干潮
  eq(trend, '下げ', '満潮から干潮へは下げ潮');
  var trend2 = T.tideTrend('QS', '2026-01-01', 8.97, 14.13); // 干潮 -> 満潮
  eq(trend2, '上げ', '干潮から満潮へは上げ潮');
  var ex = T.extremesInWindow(qs, 4, 9);
  eq(ex.length, 2, '4〜9時の窓に満潮1・干潮1が入る');
  eq(ex[0].kind, '満潮', '先に満潮');
  eq(ex[1].kind, '干潮', '次に干潮');

  // -------------------------------------------------- 代表値の取り方（B）

  section('percentile / combineModels');
  eq(R.percentile([1, 2, 3, 4, 5], 0.5), 3, '5個の中央は3番目');
  eq(R.percentile([1, 2, 3, 4], 0.75), 3, '4個の75%点は3');
  eq(R.percentile([5, 1, 3], 0), 1, '0%は最小');
  eq(R.percentile([5, 1, 3], 1), 5, '100%は最大');
  eq(R.percentile([2, null, 8, NaN], 1), 8, '欠損は無視する');
  eq(R.percentile([], 0.5), null, '有効値ゼロなら null');
  ok(R.percentile([1, 2, 3, 4], 0.5) === 2 || R.percentile([1, 2, 3, 4], 0.5) === 3,
    '分位は補間せず実在する値を返す', String(R.percentile([1, 2, 3, 4], 0.5)));

  var vals4 = [2, 4, 6, 12];
  eq(R.combineModels(vals4, 'median'), 5, 'median は中央値（偶数個は平均）');
  eq(R.combineModels(vals4, 'high'), 6, 'high は上側（悪いほう）');
  eq(R.combineModels(vals4, 'worst'), 12, 'worst は最大');
  eq(R.combineModels(vals4, undefined), 5, '未指定は median と同じ');
  eq(R.combineModels(vals4, 'nonsense'), 5, '不明な指定でも median にフォールバック');
  eq(R.combineModels([null, null], 'worst'), null, '全欠損なら null');

  section('代表値の取り方が判定に効く');
  // 1モデルだけ荒天を出す日。中央値では埋もれ、worst では効く。
  var splitDay = makeDay({ wind: 3, gust: 5, wave: 0.1 });
  splitDay.hours.forEach(function (r) { r.wind.jma_seamless = 9; r.gust.jma_seamless = 12; });

  var rMed = R.evaluateDay(splitDay, {}, { checkDirection: false });
  var rWorst = R.evaluateDay(splitDay, { modelAgg: 'worst' }, { checkDirection: false });
  var rHigh = R.evaluateDay(splitDay, { modelAgg: 'high' }, { checkDirection: false });
  eq(rMed.grade, 3, '中央値では1本の荒天予報は埋もれて ◎');
  eq(rWorst.grade, 0, '最悪を採ると荒天予報が効いて ×');
  ok(rHigh.grade <= rMed.grade, '上側は中央値より甘くならない',
    'high=' + rHigh.grade + ' median=' + rMed.grade);
  eq(rMed.modelAgg, 'median', '既定は median');
  eq(rWorst.modelAgg, 'worst', '指定した取り方が結果に載る');
  ok(rWorst.flags.indexOf('strictAgg') >= 0, '中央値以外のときはバッジが付く');
  ok(rMed.flags.indexOf('strictAgg') < 0, '中央値のときはバッジを付けない');
  // ばらつきは代表値の取り方に左右されない（荒天側に寄せて一致度が上がって見えては困る）
  eq(rWorst.confidence.sd, rMed.confidence.sd, 'モデル一致度は代表値の取り方で変わらない');
  ok(R.FLAGS.strictAgg && R.FLAGS.strictAgg.label, 'strictAgg はバッジ表に定義がある');
  R.MODEL_AGG_ORDER.forEach(function (k) {
    ok(R.MODEL_AGG[k] && R.MODEL_AGG[k].label && R.MODEL_AGG[k].desc,
      'MODEL_AGG.' + k + ' に表示名と説明がある');
  });

  // -------------------------------------------------- アンサンブル（A）

  section('アンサンブルの集計');
  var E = FF.ensemble;

  /** 3メンバーの合成アンサンブル。member[i] の hour 別風速を与える。 */
  function makeEns(members) {
    var hours = {};
    for (var h = 0; h < 24; h++) {
      hours[h] = {
        wind: members.map(function (m) { return m.wind[h]; }),
        gust: members.map(function (m) { return m.gust ? m.gust[h] : null; })
      };
    }
    return { members: members.length, days: { '2026-08-01': { date: '2026-08-01', hours: hours } },
      lastDate: '2026-08-01', dates: ['2026-08-01'] };
  }
  function flat(v) { var a = []; for (var h = 0; h < 24; h++) a.push(v); return a; }

  // メンバーAは朝だけ荒れ、メンバーBは昼だけ荒れる。
  // 窓の中の最悪値を先に取れば「朝に荒れる1本」しか出ない。
  // 先に時刻ごとの分位を取ると、朝も昼も荒れる存在しない1本が出来てしまう。
  var mA = { wind: flat(2) }; mA.wind[6] = 10;   // 朝に荒れる
  var mB = { wind: flat(2) }; mB.wind[13] = 10;  // 昼に荒れる（判定窓の外）
  var mC = { wind: flat(2) };                    // ずっと穏やか
  var ens = makeEns([mA, mB, mC]);
  var worstList = E.memberWorst(ens.days['2026-08-01'], 4, 9);
  eq(worstList.length, 3, 'メンバー数ぶん返る');
  eq(worstList[0].wind, 10, '窓内に荒れる時刻があるメンバーは10');
  eq(worstList[1].wind, 2, '窓の外で荒れるメンバーは窓内の値のまま');

  var T4 = Object.assign({}, R.DEFAULTS);
  var sum = E.daySummary(ens, '2026-08-01', 4, 9, T4);
  eq(sum.n, 3, '3本を集計');
  eq(sum.max, 10, '最大は荒れる1本');
  eq(sum.p50, 2, '中央値は穏やかなまま（1本の荒天は中央値に出ない＝裾を見る意味）');
  eq(sum.badPct, 33, '3本中1本が × なので33%');
  eq(sum.okPct, 67, '○以上は67%');
  eq(sum.counts.reduce(function (a, b) { return a + b; }, 0), 3, '内訳の合計はメンバー数');

  // 偶数本のときの分位は補間せず、荒天側（上位）を採る。
  // 安全側に倒れるほうを既定にしたいので、この挙動は意図的。
  eq(R.percentile([2, 10], 0.5), 10, '2本しか無いときの中央値は荒天側を採る');

  var allCalm = makeEns([{ wind: flat(1) }, { wind: flat(1.2) }]);
  var calmSum = E.daySummary(allCalm, '2026-08-01', 4, 9, T4);
  eq(calmSum.goodPct, 100, '全メンバーが穏やかなら ◎ 100%');
  eq(calmSum.badPct, 0, '× は0%');
  eq(E.daySummary(ens, '2099-01-01', 4, 9, T4), null, '無い日は null');

  var bands = E.hourlyBands(ens, '2026-08-01');
  eq(bands.p50.length, 24, '時刻別の帯は24要素');
  eq(bands.max[6], 10, '6時の最大は10');
  eq(bands.max[0], 2, '0時の最大は2');

  section('アンサンブルの取得URL');
  var eurl = E.url(37.2, 138.3, 16);
  ok(eurl.indexOf('wind_speed_unit=ms') >= 0, '風速の単位は m/s を明示する（既定は km/h）');
  ok(eurl.indexOf('ecmwf_ifs025') >= 0, 'ECMWF アンサンブルを指定');
  ok(eurl.indexOf('timezone=Asia%2FTokyo') >= 0, 'タイムゾーンは日本時間');

  // メンバー名の付き方（制御ラン＋member01..）が変わると全メンバーを取り落とす
  var fake = { hourly: { time: ['2026-08-01T00:00'],
    wind_speed_10m: [1], wind_speed_10m_member01: [2], wind_speed_10m_member02: [3],
    wind_gusts_10m: [4], wind_gusts_10m_member01: [5], wind_gusts_10m_member02: [6] } };
  var parsed = E.parse(fake);
  eq(parsed.members, 3, '制御ランもメンバーとして数える');
  eq(parsed.days['2026-08-01'].hours[0].wind.length, 3, '3本ぶんの風速が入る');

  // -------------------------------------------------- 答え合わせ（C）

  section('検証データの整合');
  if (FF.verify && FF.verify.available()) {
    var VD = FF.verify.data();
    // 記録側（PowerShell）と判定側（JS）で判定窓の定義がずれると、
    // 別の時間帯どうしを比べることになり、成績が意味を失う。
    eq(VD.window.before, R.DEFAULTS.windowBeforeSunrise, '記録側の窓の開始が rating.js と一致');
    eq(VD.window.after, R.DEFAULTS.windowAfterSunrise, '記録側の窓の終了が rating.js と一致');
    eq(VD.window.period, 'morning', '記録は朝マヅメ帯で固定');
    ok(VD.models && VD.models.length === 4, '4モデルぶん記録している');
    ok(FF.verify.station() && FF.verify.station().name, '観測地点の表示名が引ける');
    // アーカイブ由来はリード別の集計に混ぜてはいけない（実際より当たって見えるため）
    var arcOnly = true;
    FF.verify.seriesKeys().forEach(function (m) {
      var a = FF.verify.cell(m, 'archive');
      var all = FF.verify.cell(m, 'all');
      if (a && a.n > 0 && all && all.n > 0 && all.n < a.n) arcOnly = false;
    });
    ok(arcOnly, 'アーカイブ由来は all に混ざっていない');
    var prog = FF.verify.progress();
    ok(prog.minUseful >= 30, '結論を出すには最低30件を要求している');
    if (!prog.enough) {
      eq(FF.verify.bestIn('d1_3'), null, 'サンプル不足のうちは順位を出さない');
    }
  } else {
    ok(true, '検証データはまだ無い（収集前でも本体は動く）');
  }

  section('日付ユーティリティ');
  eq(T.dateKey(new Date(2026, 6, 28)), '2026-07-28', 'dateKey はローカル日付');
  eq(T.shiftDateKey('2026-12-31', 1), '2027-01-01', '年またぎのシフト');
  eq(T.shiftDateKey('2026-03-01', -1), '2026-02-28', '月またぎのシフト');

  section('釣り場マスタ');
  var S = FF.spots;
  ok(S && S.SPOTS.length >= 8, '釣り場が読み込めている');
  ok(S.BOATS.length >= 3, '出船地点が3か所以上ある');

  // 追加のたびに壊れやすいところをまとめて検査する。
  // 釣り場は今後も増えるので、1件ずつの期待値ではなく全件に対する条件で書く。
  var ids = {};
  S.SPOTS.forEach(function (sp) {
    ok(!ids[sp.id], '釣り場IDが重複していない: ' + sp.id);
    ids[sp.id] = true;
    ok(!!S.regionName(sp.region) && S.regionName(sp.region) !== sp.region,
      sp.short + ' の region が REGIONS にある');
    ok(!!T.STATION_NAMES[sp.tide], sp.short + ' の潮汐地点が存在する: ' + sp.tide);
    ok(T.coverage(sp.tide) !== null, sp.short + ' の潮位データが読める');
    ok(sp.lat > 20 && sp.lat < 50 && sp.lon > 120 && sp.lon < 150,
      sp.short + ' の座標が日本の範囲にある');
    ok(sp.kind === 'boat' || sp.kind === 'shore', sp.short + ' の種別が boat/shore');
  });
  S.BOATS.forEach(function (sp) {
    ok(sp.profile && typeof sp.profile.onshoreFrom === 'number' && typeof sp.profile.onshoreTo === 'number',
      sp.short + ' に吹き付け風の方位がある');
  });

  // 岸の向きから危険風向を作る計算。直江津の既定値を再現できることを基準にする。
  var f0 = S.facing(0);
  eq(f0.onshoreFrom, 292.5, '正面Nの吹き付け風の開始は直江津の既定値と同じ');
  eq(f0.onshoreTo, 67.5, '正面Nの吹き付け風の終了も同じ');
  eq(f0.offshoreFrom, 112.5, '正面Nの沖出しの開始も同じ');
  eq(f0.offshoreTo, 247.5, '正面Nの沖出しの終了も同じ');
  var f90 = S.facing(90);
  eq(f90.onshoreFrom, 22.5, '正面Eなら吹き付け風はNNEから');
  eq(f90.onshoreTo, 157.5, '正面Eなら吹き付け風はSSEまで');

  // 実際の海岸の向きが判定に効いているか。走水（東北東向き）に東風が当たり、
  // 直江津（北向き）の設定では同じ東風が吹き付けにならないこと。
  var hashi = S.byId('hashirimizu');
  var nao = S.byId('naoetsu');
  ok(R.inDirRange(90, hashi.profile.onshoreFrom, hashi.profile.onshoreTo),
    '走水では東風が吹き付け風になる');
  ok(!R.inDirRange(90, nao.profile.onshoreFrom, nao.profile.onshoreTo),
    '直江津では東風は吹き付け風にならない');
  ok(R.inDirRange(315, nao.profile.onshoreFrom, nao.profile.onshoreTo),
    '直江津では北西風が吹き付け風になる');
  ok(!R.inDirRange(315, hashi.profile.onshoreFrom, hashi.profile.onshoreTo),
    '走水では北西風は吹き付け風にならない');

  var miura = S.byId('miurakaigan');
  ok(R.inDirRange(112.5, miura.profile.onshoreFrom, miura.profile.onshoreTo),
    '三浦海岸では東南東風が吹き付け風になる');
  ok(!R.inDirRange(270, miura.profile.onshoreFrom, miura.profile.onshoreTo),
    '三浦海岸では西風は吹き付け風にならない');

  // しきい値の重ね順（既定 -> 全体 -> 釣り場の profile -> 釣り場ごとの上書き）。
  // 岸の向きが全体設定に負けると、最初の設計ミス（直江津の北風ペナルティが三浦に出る）に戻る。
  section('しきい値の重ね順');
  var globalSettings = Object.assign({}, R.DEFAULTS, { goodWind: 5.0, onshoreFrom: 999 });
  var eff = Object.assign({}, globalSettings, hashi.profile, { goodWind: 3.0 });
  eq(eff.goodWind, 3.0, '釣り場ごとの上書きが全体設定に勝つ');
  eq(eff.onshoreFrom, hashi.profile.onshoreFrom, '岸の向きは全体設定に上書きされない');
  var eff2 = Object.assign({}, globalSettings, hashi.profile);
  eq(eff2.goodWind, 5.0, '釣り場で上書きしていない項目は全体設定を継承する');

  // ---------------------------------------------------------------- 集計

  var s = document.getElementById('summary');
  s.textContent = 'RESULT: ' + passed + ' passed, ' + failed + ' failed';
  s.className = failed ? 'fail' : 'pass';
  document.title = failed ? 'TESTS FAILED' : 'TESTS PASSED';
})();
</script>
</body>
</html>
